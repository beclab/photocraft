apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: photocraft
  appid: photocraft
  title: PhotoCraft
  description: Photoshop-style image editor that runs in your browser
  icon: https://raw.githubusercontent.com/beclab/photocraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.photocraft.png
  version: 0.2.0
  categories:
    - Utilities_v112
    - Creativity
    - workspace
spec:
  versionName: "0.9.0"
  fullDescription: |
    ## Overview
    PhotoCraft is an open-source, Photoshop-comparable image editor written
    in Rust. This app serves its WebAssembly build: editing runs entirely in
    your browser, and images never leave your device.

    Open uses the browser file picker; Save and Export download files.
    Save your work before closing or reloading the page.

    ## Agent API
    The app also runs photocraft-agent, an HTTP service that applies
    PhotoCraft engine commands to uploaded images, for agents on this
    Olares such as Lares. Other apps reach it at
    `http://photocraft-agent.photocraft-shared:8090`:
    - `GET /v1/commands?filter=blur` lists commands
    - `POST /v1/process` (multipart `file`, `steps`, `format`) returns the result
    - `POST /v1/inspect` (multipart `file`) describes the document

    Only an administrator can install it; it serves every user.

    ## Requirements
    - A browser with WebGPU or WebGL2
    - Arch: amd64, arm64
  developer: storytold
  submitter: beclab
  website: https://github.com/storytold/photocraft
  sourceCode: https://github.com/beclab/photocraft
  license:
    - text: MIT OR Apache-2.0
      url: https://github.com/storytold/photocraft/blob/main/LICENSE-MIT
  locale:
    - en-US
    - zh-CN
  onlyAdmin: true
  requiredCpu: 100m
  limitedCpu: "5"
  requiredMemory: 512Mi
  limitedMemory: 6Gi
  requiredDisk: 50Mi
  limitedDisk: 200Mi
  supportArch:
    - amd64
    - arm64
entrances:
  - name: photocraft
    host: photocraft-svc
    port: 8080
    title: PhotoCraft
    icon: https://raw.githubusercontent.com/beclab/photocraft/main/assets/app-icon/hicolor/256x256/apps/ai.storyteller.photocraft.png
    authLevel: private
    openMethod: window
options:
  shared: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  photocraft: 1
  photocraft-agent: 1
